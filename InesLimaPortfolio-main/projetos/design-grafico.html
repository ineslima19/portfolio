
<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Design Gráfico | Inês Lima</title>

    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../projetos/design-grafico.css">
</head>

<body class="pagina-design">

    <!-- MENU -->
    
<header class="navbar">
    <nav>
        <a href="../../index.html#sobre">Sobre Mim</a>
        <a href="../../index.html#projetos">Projetos</a>
        <a href="../../index.html#contactos">Contactos</a>
    </nav>
</header>


    <main>

        <!-- NAVEGAÇÃO -->
        
<div class="navegacao-projetos">

    <a href="../projetos/editorial.html" class="projeto-anterior">
        <span aria-hidden="true">←</span>
        Projeto anterior
    </a>

</div>


        <!-- APRESENTAÇÃO -->
        <section class="design-topo">

            <div class="design-introducao">

                <span class="design-numero">03.</span>

                <div class="design-descricao">

                    <h1>Design Gráfico</h1>

                    <p>
                        Nesta seleção de trabalhos de design gráfico,
                        exploro a criatividade, a composição visual
                        e a utilização da cor e da tipografia.
                        Através da criação de cartazes, procuro
                        transmitir mensagens de forma clara,
                        apelativa e original.
                    </p>

                </div>

            </div>

        </section>

        <!-- GALERIA -->
        <section class="design-gallery"
                 aria-label="Projetos de design gráfico">

            <!-- IMAGEM 1 -->
            <figure class="design-item">
                <img
                    src="../imagens/Cartaz da Francofonia com Câmara e Arco-Íris.png"
                    alt="Cartaz da Francofonia"
                    loading="lazy">
                <figcaption>Cartaz para um evento da Francofonia</figcaption>
            </figure>

            <!-- IMAGEM 2 -->
            <figure class="design-item">
                <img
                    src="../imagens/cartaz_filosofia_original_intacto.png"
                    alt="Cartaz de filosofia"
                    loading="lazy">
                <figcaption>Cartaz dia mundial da Filosofia</figcaption>
            </figure>

            <!-- IMAGEM 3 -->
            <figure class="design-item">
                <img
                    src="../imagens/cartaz_fundo_original_intacto.png"
                    alt="Terceiro cartaz de design gráfico"
                    loading="lazy">
                <figcaption>Postal de Boas Festas desenvolvido para a APIGRAF</figcaption>
            </figure>

        </section>

   
    </main>

    <!-- VISUALIZADOR DE IMAGENS -->
    <div class="lightbox" id="lightbox">

        <button
            class="lightbox-fechar"
            type="button"
            aria-label="Fechar imagem">
            &times;
        </button>

        <img id="lightbox-imagem" src="" alt="">

    </div>

    <script src="../lightbox.js"></script>

</body>
</html>
