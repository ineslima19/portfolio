<!DOCTYPE html>

<head>
  <meta charset="UTF-8">

<body>
  
<header class="navbar">
    <nav aria-label="Menu principal">
        <a href="../../index.html#sobre">Sobre Mim</a>
        <a href="../../index.html#projetos">Projetos</a>
        <a href="../../index.html#contactos">Contactos</a>
    </nav>
</header>


  
<main>

    <!-- NAVEGAÇÃO ENTRE PROJETOS -->
    
<div class="navegacao-projetos">

    <a href="../projetos/branding.html" class="projeto-anterior">
        <span aria-hidden="true">←</span>
        Projeto anterior
    </a>

    <a href="../projetos/design-grafico.html" class="proximo-projeto">
        Próximo projeto
        <span aria-hidden="true">→</span>
    </a>

</div>


    <!-- APRESENTAÇÃO DO PROJETO -->
    <section class="editorial-topo">

        <div class="editorial-introducao">

            <span class="numero-projeto">02.</span>

            <div class="editorial-descricao">

                <h1>Editorial</h1>

                <p>
                    Nesta seleção de projetos editoriais, exploro a
                    composição gráfica, a tipografia e a organização
                    visual de diferentes conteúdos, desenvolvidos
                    através do Adobe InDesign e Adobe Illustrator.
                </p>

            </div>

        </div>

    </section>

    <!-- GALERIA -->
    <section class="editorial-gallery">

        <figure class="editorial-item">
            <div class="editorial-imagem">
                <img
                    src="../imagens/revistaV.png"
                    alt="Conceito de capa para a revista Visão">
            </div>
            <figcaption>Revista VISÃO</figcaption>
        </figure>

        <figure class="editorial-item">
            <div class="editorial-imagem">
                <img
                    src="../imagens/revistaD.png"
                    alt="Conceito de capa para uma revista de design de interiores">
            </div>
            <figcaption>Revista de Design de Interiores</figcaption>
        </figure>

        <figure class="editorial-item">
            <div class="editorial-imagem">
                <img
                    src="../imagens/capa.png"
                    alt="Conceito de capa de um livro">
            </div>
            <figcaption>Capa do livro</figcaption>
        </figure>

        <figure class="editorial-item">
            <div class="editorial-imagem">
                <img
                    src="../imagens/contracapa.png"
                    alt="Contracapa do livro">
            </div>
            <figcaption>Contracapa do livro</figcaption>
        </figure>

    </section>


</main>

<!-- VISUALIZADOR DE IMAGENS -->
<div class="lightbox" id="lightbox">

    <button
        class="lightbox-fechar"
        type="button"
        aria-label="Fechar imagem">
        &times;
    </button>

    <img id="lightbox-imagem" src="" alt="">

</div>

<script src="../lightbox.js"></script>
